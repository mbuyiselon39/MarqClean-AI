<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="mCrystal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>
    <linearGradient id="mCrystal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80F5FF"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="mFacetTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E0FFFF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark rounded tile background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGlow)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(0,210,255,0.3)" stroke-width="1.5"/>

  <!-- Glowing Crystal M Logo -->
  <g transform="translate(14, 16)" filter="url(#glow)">
    <!-- Outer Facets -->
    <path d="M10 76 L10 24 L32 4 L50 22 L68 4 L90 24 L90 76 L74 62 L74 32 L50 48 L26 32 L26 62 Z" fill="url(#mCrystal1)"/>
    
    <!-- Inner High-Contrast Facet Planes -->
    <path d="M32 4 L50 22 L26 32 Z" fill="url(#mFacetTop)" opacity="0.9"/>
    <path d="M68 4 L74 32 L50 22 Z" fill="url(#mFacetTop)" opacity="0.95"/>
    <path d="M10 24 L32 4 L26 32 L10 48 Z" fill="url(#mCrystal2)" opacity="0.85"/>
    <path d="M90 24 L90 48 L74 32 L68 4 Z" fill="url(#mCrystal2)" opacity="0.85"/>
    <path d="M50 22 L50 48 L26 32 Z" fill="#0055DD" opacity="0.7"/>
    <path d="M50 22 L74 32 L50 48 Z" fill="#0077FF" opacity="0.8"/>
    
    <!-- Lower Wings -->
    <path d="M10 48 L26 62 L10 76 Z" fill="#003399"/>
    <path d="M90 48 L90 76 L74 62 Z" fill="#003399"/>
    <path d="M26 62 L50 78 L50 48 Z" fill="url(#mCrystal1)" opacity="0.9"/>
    <path d="M74 62 L50 48 L50 78 Z" fill="url(#mCrystal2)" opacity="0.9"/>

    <!-- Cyber Circuit Nodes inside the M -->
    <circle cx="34" cy="46" r="2" fill="#FFFFFF"/>
    <circle cx="66" cy="46" r="2" fill="#FFFFFF"/>
    <circle cx="50" cy="62" r="2.5" fill="#FFFFFF"/>
    <line x1="34" y1="46" x2="50" y2="62" stroke="#80F5FF" stroke-width="1.2" stroke-dasharray="2 1"/>
    <line x1="66" y1="46" x2="50" y2="62" stroke="#80F5FF" stroke-width="1.2" stroke-dasharray="2 1"/>
    <line x1="50" y1="62" x2="50" y2="76" stroke="#00F0FF" stroke-width="1.5"/>
  </g>
</svg>
