name: MarqClean AI quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Production build
        run: npm run build
      - name: Runtime routing and deployment smoke checks
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const app = fs.readFileSync("App.tsx", "utf8");
          const index = fs.readFileSync("index.html", "utf8");
          const seo = fs.readFileSync("seo.ts", "utf8");
          const redirects = fs.readFileSync("public/_redirects", "utf8");
          const sitemap = fs.readFileSync("public/sitemap.xml", "utf8");
          const robots = fs.readFileSync("public/robots.txt", "utf8");
          const css = fs.readFileSync("index.css", "utf8");
          const clientFunds = fs.readFileSync("ClientFunds.tsx", "utf8");
          const hero = fs.readFileSync("HeroCarousel.tsx", "utf8");
          const faqApp = fs.readFileSync("App.tsx", "utf8");
          const og = fs.readFileSync("public/og-card.png");
          const docs = fs.existsSync("docs/design-reference.md");
          const distFonts = fs.existsSync("dist/fonts") ? fs.readdirSync("dist/fonts").filter((name) => name.endsWith(".woff2")) : [];
          const fontBytes = distFonts.reduce((sum, name) => sum + fs.statSync(`dist/fonts/${name}`).size, 0);


          const ogWidth = og.readUInt32BE(16);
          const ogHeight = og.readUInt32BE(20);

          const checks = [
            [app.includes('if (!route) return "home";'), "root route guard"],
            [app.includes("const route = hashRoute || (pathRoute !== \"index.html\" ? pathRoute : \"\");"), "index.html route normalization"],
            [index.includes("https://marqcleanai.vertexsg.co.za/"), "index production hostname"],
            [seo.includes('const SITE_URL = "https://marqcleanai.vertexsg.co.za";'), "runtime SEO hostname"],
            [redirects.includes("/*                          /index.html           200"), "SPA fallback rewrite"],
            [sitemap.includes("https://marqcleanai.vertexsg.co.za/"), "sitemap hostname"],
            [robots.includes("https://marqcleanai.vertexsg.co.za/sitemap.xml"), "robots sitemap"],
            [css.includes("--surface-inverse") && css.includes("--on-inverse"), "inverse surface tokens"],
            [css.includes(".mc-faq-trigger") && faqApp.includes('aria-expanded={isOpen}'), "accessible FAQ disclosures"],
            [!clientFunds.includes(">Diagnostics<") && !clientFunds.includes("Diagnostics: Test Workbook"), "customer diagnostics removed"],
            [hero.includes('href: "/excel-automation"') && hero.includes('href: "/data-toolbox"'), "hero navigation links"],
            [og.slice(0, 8).equals(Buffer.from([137,80,78,71,13,10,26,10])) && ogWidth === 1200 && ogHeight === 630, "1200x630 PNG OG image"],
            [!css.includes("text-align: justify") && !css.includes("hyphens: auto") && !css.includes("!important"), "no legacy text/important overrides"],
            [css.includes("Clash Grotesk") && css.includes("Satoshi"), "brand font families"],
            [docs, "design reference documentation"],
            [distFonts.length >= 1 && fontBytes < 150000, "self-hosted font budget"],
            [index.includes("/fonts/") && !index.includes("fonts.googleapis.com"), "local font preloads"],
          ];

          const failures = checks.filter(([ok]) => !ok).map(([, name]) => name);
          if (failures.length) {
            console.error("Smoke checks failed:", failures.join(", "));
            process.exit(1);
          }
          const allSource = [app, css, clientFunds, hero].join("\n");
          if (/bg-ink[^\n]*text-ink/.test(allSource)) {
            console.error("Matching bg-ink/text-ink colour tokens remain.");
            process.exit(1);
          }
          if (app.includes("text-justify") || clientFunds.includes("text-justify") || hero.includes("text-justify")) {
            console.error("Justified body copy utility remains.");
            process.exit(1);
          }

          if (app.includes("https://www.marqcleanai.vertexsg.co.za") ||
              index.includes("https://www.marqcleanai.vertexsg.co.za") ||
              seo.includes("https://www.marqcleanai.vertexsg.co.za") ||
              sitemap.includes("https://www.marqcleanai.vertexsg.co.za") ||
              robots.includes("https://www.marqcleanai.vertexsg.co.za")) {
            console.error("Mixed www/non-www production hostnames detected.");
            process.exit(1);
          }
          const shadows = [...css.matchAll(/box-shadow:\s*([^;}]*)/g)].map((match) => match[1].trim()).filter((value) => value && value !== "none");
          if (shadows.length) {
            console.error("Non-zero CSS shadows remain.");
            process.exit(1);
          }
          console.log("Routing, visual-system, font, and production hostname checks passed.");
          NODE
      - name: Cloudflare Pages asset-size guard
        run: |
          oversized="$(find dist -type f -size +24M -print)"
          if [ -n "$oversized" ]; then
            echo "Assets above the 24 MiB safety threshold were found:"
            echo "$oversized"
            exit 1
          fi
          echo "Cloudflare Pages asset-size guard passed."
